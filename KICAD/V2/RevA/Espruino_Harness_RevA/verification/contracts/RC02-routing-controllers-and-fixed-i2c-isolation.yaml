  forbidden_same_net:
    - id: RC02-F01
      endpoints: [U606.2, U606.3]
      reason: The target SDA branch must cross the power-qualified U606 channel rather than bypass it.
    - id: RC02-F02
      endpoints: [U606.5, U606.6]
      reason: The target SCL branch must cross the power-qualified U606 channel rather than bypass it.
    - id: RC02-F03
      endpoints: [U606.9, U606.8]
      reason: The Test Block SDA branch must cross the power-qualified U606 channel rather than bypass it.
    - id: RC02-F04
      endpoints: [U606.12, U606.11]
      reason: The Test Block SCL branch must cross the power-qualified U606 channel rather than bypass it.
    - id: RC02-F05
      endpoints: [U607.5, U607.6]
      reason: Target-rail sensing must remain distinct from the Routing Logic supply domain.
    - id: RC02-F06
      endpoints: [U608.5, U608.6]
      reason: Test Block rail sensing must remain distinct from the Routing Logic supply domain.
    - id: RC02-F07
      endpoints: [R630.1, R630.2]
      reason: The target-I2C enable pull-up must remain explicit and not bypass the U607 output.
    - id: RC02-F08
      endpoints: [R632.1, R632.2]
      reason: The Test Block-I2C enable pull-up must remain explicit and not bypass the U608 output.
    - id: RC02-F09
      endpoints: [R634.1, R634.2]
      reason: ROUTE_CLEAR_N must remain an open-drain reset net with an explicit Routing Logic pull-up.
    - id: RC02-F10
      endpoints: [U1201.27, Q1203.3]
      reason: The Rack Control GPIO must reach ROUTE_CLEAR_N only through the open-drain stage.
    - id: RC02-F11
      endpoints: [R1209.1, R1209.2]
      reason: The Hardware Clear gate-series resistor must remain explicit.
