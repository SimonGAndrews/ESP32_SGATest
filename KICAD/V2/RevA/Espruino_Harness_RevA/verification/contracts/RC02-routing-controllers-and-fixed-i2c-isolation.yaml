    - {ref: U606, pin: "6", net: ROUTE_I2C_SCL}
    - {ref: U606, pin: "7", net: TI_GND}
    - {ref: U606, pin: "8", net: IP03_TEST_BLOCK_SDA}
    - {ref: U606, pin: "9", net: ROUTE_I2C_SDA}
    - {ref: U606, pin: "10", net: TEST_I2C_ISO_EN}
    - {ref: U606, pin: "11", net: IP04_TEST_BLOCK_SCL}
    - {ref: U606, pin: "12", net: ROUTE_I2C_SCL}
    - {ref: U606, pin: "13", net: TEST_I2C_ISO_EN}
    - {ref: U606, pin: "14", net: ROUTING_LOGIC_3V3}

