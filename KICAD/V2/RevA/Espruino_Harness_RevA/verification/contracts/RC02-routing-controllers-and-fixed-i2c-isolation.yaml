schema_version: 1
kind: block_contract
block_id: RC02

# Independent machine-checkable intent derived from the accepted routing-
# controller allocation, fixed-I2C isolation, TPS3808 rail qualification and
# Hardware Clear analysis. RC01 separately proves the nineteen RP switch paths
# and their external pull-downs. MPN, package, timing and analogue limits remain
# human-reviewed baseline and PCB-stage evidence rather than schema-version 1
# connectivity assertions.
assertions:
  pin_net:
    # U606 fixed, power-qualified target and Test Block I2C boundaries.
    - {ref: U606, pin: "1", net: TARGET_I2C_ISO_EN}
    - {ref: U606, pin: "2", net: TI_I2C_SDA}
    - {ref: U606, pin: "3", net: ROUTE_I2C_SDA}
