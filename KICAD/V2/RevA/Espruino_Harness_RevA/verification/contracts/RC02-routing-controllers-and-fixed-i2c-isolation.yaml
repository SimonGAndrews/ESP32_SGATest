    - {ref: R622, pin: "1", net: ROUTING_LOGIC_3V3}
    - {ref: R622, pin: "2", net: ROUTE_I2C_SDA}
    - {ref: R623, pin: "1", net: ROUTING_LOGIC_3V3}
    - {ref: R623, pin: "2", net: ROUTE_I2C_SCL}

