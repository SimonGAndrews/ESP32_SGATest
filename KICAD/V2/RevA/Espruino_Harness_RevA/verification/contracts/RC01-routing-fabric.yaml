    - {ref: R24, pin: "1", net: RP19_EN}
    - {ref: R24, pin: "2", net: TI_GND}

    # Local bypassing for every RC01 switch package.
    - {ref: C601, pin: "1", net: ROUTING_LOGIC_3V3}
    - {ref: C601, pin: "2", net: TI_GND}
    - {ref: C602, pin: "1", net: ROUTING_LOGIC_3V3}
    - {ref: C602, pin: "2", net: TI_GND}
    - {ref: C603, pin: "1", net: ROUTING_LOGIC_3V3}
