    - {ref: R610, pin: "1", net: RP08_EN}
    - {ref: R610, pin: "2", net: TI_GND}
    - {ref: R11, pin: "1", net: RP09_EN}
    - {ref: R11, pin: "2", net: TI_GND}
    - {ref: R12, pin: "1", net: RP10_EN}
    - {ref: R12, pin: "2", net: TI_GND}
    - {ref: R14, pin: "1", net: RP11_EN}
    - {ref: R14, pin: "2", net: TI_GND}
    - {ref: R15, pin: "1", net: RP12_EN}
    - {ref: R15, pin: "2", net: TI_GND}
    - {ref: R16, pin: "1", net: RP13_EN}
