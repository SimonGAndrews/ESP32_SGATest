    - {ref: R17, pin: "1", net: RP14_EN}
    - {ref: R17, pin: "2", net: TI_GND}
    - {ref: R19, pin: "1", net: RP15_EN}
    - {ref: R19, pin: "2", net: TI_GND}
    - {ref: R20, pin: "1", net: RP16_EN}
    - {ref: R20, pin: "2", net: TI_GND}
    - {ref: R21, pin: "1", net: RP17_EN}
