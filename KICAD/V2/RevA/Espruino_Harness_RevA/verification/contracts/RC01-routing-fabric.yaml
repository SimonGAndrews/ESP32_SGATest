schema_version: 1
kind: block_contract
block_id: RC01

# Independent machine-checkable intent derived from the accepted RP01-RP19
# matrix, the TMUX1511 PW pin table and the RC01 safe-state analysis. Physical
# loading, powered-off leakage and fitted/DNP disposition remain baseline and
# PCB/release checks rather than netlist-connectivity assertions.
assertions:
  pin_net:
    # U601: RP01-RP04 on route entries R0 and R1.
    - {ref: U601, pin: "1", net: RP01_EN}
    - {ref: U601, pin: "2", net: R0}
    - {ref: U601, pin: "3", net: TI_ANALOG_ADC_IN}
    - {ref: U601, pin: "4", net: RP02_EN}
    - {ref: U601, pin: "5", net: R0}
    - {ref: U601, pin: "6", net: TI_ONEWIRE_DQ}
    - {ref: U601, pin: "7", net: TI_GND}
    - {ref: U601, pin: "8", net: TI_GPIO_LOOP_A_OUT}
    - {ref: U601, pin: "9", net: R1}
    - {ref: U601, pin: "10", net: RP03_EN}
    - {ref: U601, pin: "11", net: TI_SPI_MISO}
    - {ref: U601, pin: "12", net: R1}
    - {ref: U601, pin: "13", net: RP04_EN}
    - {ref: U601, pin: "14", net: ROUTING_LOGIC_3V3}

    # U602: RP05-RP08 on route entry R2.
    - {ref: U602, pin: "1", net: RP05_EN}
    - {ref: U602, pin: "2", net: R2}
    - {ref: U602, pin: "3", net: TI_GPIO_LOOP_A_IN}
    - {ref: U602, pin: "4", net: RP06_EN}
    - {ref: U602, pin: "5", net: R2}
    - {ref: U602, pin: "6", net: TI_I2C_FB}
    - {ref: U602, pin: "7", net: TI_GND}
    - {ref: U602, pin: "8", net: TI_SPI_CS_ADC}
    - {ref: U602, pin: "9", net: R2}
    - {ref: U602, pin: "10", net: RP07_EN}
    - {ref: U602, pin: "11", net: TI_ONEWIRE_GPIO_A_FB}
    - {ref: U602, pin: "12", net: R2}
    - {ref: U602, pin: "13", net: RP08_EN}
    - {ref: U602, pin: "14", net: ROUTING_LOGIC_3V3}

    # U603: RP09-RP11 on R3 and RP12 on R4.
    - {ref: U603, pin: "1", net: RP09_EN}
    - {ref: U603, pin: "2", net: R3}
    - {ref: U603, pin: "3", net: TI_GPIO_LOOP_B_OUT}
    - {ref: U603, pin: "4", net: RP10_EN}
    - {ref: U603, pin: "5", net: R3}
    - {ref: U603, pin: "6", net: TI_SPI_MOSI}
    - {ref: U603, pin: "7", net: TI_GND}
    - {ref: U603, pin: "8", net: TI_UART_A_TX}
    - {ref: U603, pin: "9", net: R3}
    - {ref: U603, pin: "10", net: RP11_EN}
    - {ref: U603, pin: "11", net: TI_SPI_SCK}
    - {ref: U603, pin: "12", net: R4}
    - {ref: U603, pin: "13", net: RP12_EN}
    - {ref: U603, pin: "14", net: ROUTING_LOGIC_3V3}

    # U604: RP13 on R4, RP14-RP15 on R5 and RP16 on R6.
    - {ref: U604, pin: "1", net: RP13_EN}
    - {ref: U604, pin: "2", net: R4}
    - {ref: U604, pin: "3", net: TI_UART_A_RX}
    - {ref: U604, pin: "4", net: RP14_EN}
    - {ref: U604, pin: "5", net: R5}
    - {ref: U604, pin: "6", net: TI_ANALOG_PWM_OUT}
    - {ref: U604, pin: "7", net: TI_GND}
    - {ref: U604, pin: "8", net: TI_RGB_DATA}
    - {ref: U604, pin: "9", net: R5}
    - {ref: U604, pin: "10", net: RP15_EN}
    - {ref: U604, pin: "11", net: TI_GPIO_LOOP_B_IN}
    - {ref: U604, pin: "12", net: R6}
    - {ref: U604, pin: "13", net: RP16_EN}
    - {ref: U604, pin: "14", net: ROUTING_LOGIC_3V3}

    # U605: RP17-RP19 on R6; channel 4 is hard disabled.
    - {ref: U605, pin: "1", net: RP17_EN}
    - {ref: U605, pin: "2", net: R6}
    - {ref: U605, pin: "3", net: TI_I2C_INT}
    - {ref: U605, pin: "4", net: RP18_EN}
    - {ref: U605, pin: "5", net: R6}
    - {ref: U605, pin: "6", net: TI_SPI_CS_EXT}
    - {ref: U605, pin: "7", net: TI_GND}
    - {ref: U605, pin: "8", net: TI_ONEWIRE_GPIO_B_FB}
    - {ref: U605, pin: "9", net: R6}
    - {ref: U605, pin: "10", net: RP19_EN}
    - {ref: U605, pin: "13", net: TI_GND}
    - {ref: U605, pin: "14", net: ROUTING_LOGIC_3V3}

    # One external safe-state pull-down for every implemented route enable.
    - {ref: R601, pin: "1", net: RP01_EN}
    - {ref: R601, pin: "2", net: TI_GND}
    - {ref: R602, pin: "1", net: RP02_EN}
    - {ref: R602, pin: "2", net: TI_GND}
    - {ref: R604, pin: "1", net: RP03_EN}
    - {ref: R604, pin: "2", net: TI_GND}
